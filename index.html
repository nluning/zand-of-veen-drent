<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zand-Drent of Veen-Drent?</title>
  <style>
    .layout {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .controls {
      flex: 1 1 18rem;
      min-width: 0;
      overflow-x: auto;
    }
    #map {
      flex: 1 1 18rem;
      aspect-ratio: 1;
      align-self: start;
      border: 1px solid #999;
      background: #eee;
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
        integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw=="
        crossorigin="">
</head>
<body>
  <h1>Waar kom je weg?</h1>

  <p>Voer je woonplaats in of klik op de kaart</p>

  <div class="layout">
    <div class="controls">
      <input id="place" type="text" placeholder="e.g. Exloo">
      <button id="search">Zoek</button>

      <h2 id="answer"></h2>
      <pre id="output"></pre>
    </div>
    <div id="map"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
          integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g=="
          crossorigin=""></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.15.0/proj4.js"
          integrity="sha512-zlBm5j/0UjgCzqBVLkATd/2b9Yun4SzATXJ7v1T2KfjmP0iw8FUcG5mPD60SrdxU+tRkACm3IQRq55pEkp9Qow=="
          crossorigin=""></script>
  <script>
    const BASE_URL ="https://api.pdok.nl/bzk/locatieserver/search/v3_1/free";

    // Locatieserver returns points as WKT, e.g. "POINT(254507.049 545156.929)".
    function parseWktPoint(wkt) {
      const match = wkt.match(/POINT\(([-\d.]+) ([-\d.]+)\)/);
      if (!match) {
        throw new Error("Not a WKT point: " + wkt);
      }
      return { x: Number(match[1]), y: Number(match[2]) };
    }

    async function findPlace(name) {
      const params = new URLSearchParams({ q: name, rows: 1, fl: "weergavenaam,centroide_rd,centroide_ll" });
      params.append("fq", "type:woonplaats");
      params.append("fq", "provincienaam:Drenthe");

      const response = await fetch(BASE_URL + "?" + params);
      const data = await response.json();

      const doc = data.response.docs[0];
      if (!doc) {
        return null;
      }
      return {
        name: doc.weergavenaam,
        rd: parseWktPoint(doc.centroide_rd),  // metres, EPSG:28992
        ll: parseWktPoint(doc.centroide_ll),  // degrees, x = longitude, y = latitude (WGS84)
      };
    }

    const REVERSE_URL = "https://api.pdok.nl/bzk/locatieserver/search/v3_1/reverse";

    async function findPlaceAt(lat, lon) {
      const params = new URLSearchParams({
        lat: lat,
        lon: lon,
        type: "woonplaats",
        rows: 1,
        fl: "weergavenaam,provincienaam,afstand",
      });
      const response = await fetch(REVERSE_URL + "?" + params);
      const data = await response.json();

      const doc = data.response.docs[0];
      if (!doc || doc.provincienaam !== "Drenthe" || doc.afstand >= 1) {
        return null;
      }
      return { name: doc.weergavenaam };
    }

    const SOIL_URL = "https://service.pdok.nl/bzk/bro-bodemkaart/wms/v1_0";

    // The Bodemkaart has no WFS, so a point is queried with WMS GetFeatureInfo, which
    // answers for one pixel of a rendered image. The image is a 10 m x 10 m box of
    // 101 x 101 pixels centred on the point, queried at the middle pixel (50,50).
    async function findSoil(x, y) {
      const half = 5;
      const bbox = [x - half, y - half, x + half, y + half];

      const params = new URLSearchParams({
        SERVICE: "WMS",
        VERSION: "1.3.0",
        REQUEST: "GetFeatureInfo",
        LAYERS: "soilarea",
        QUERY_LAYERS: "soilarea",
        STYLES: "",
        CRS: "EPSG:28992",
        BBOX: bbox.join(","),
        WIDTH: 101,
        HEIGHT: 101,
        I: 50,
        J: 50,
        INFO_FORMAT: "application/json",
      });

      const response = await fetch(SOIL_URL + "?" + params);
      const data = await response.json();
      return data.features; // empty in built-up areas
    }

    // Semicolons are dropped, spaces become dashes. The name is returned without the
    // surrounding sentence so the page can put it in italics.
    function dashedName(soilName) {
      return soilName.replace(/;/g, "").trim().replace(/\s+/g, "-");
    }

    // G = geological boreholes, GT = geotechnical boreholes. Both registers work in two
    // steps: POST a search area to /characteristics/searches (BRO ids and locations),
    // then GET /objects/{broId} for the full borehole, including its layers.
    const BRO_APIS = {
      G:  "https://publiek.broservices.nl/sr/bhrg/v3",
      GT: "https://publiek.broservices.nl/sr/bhrgt/v2",
    };

    // Search radii in kilometres, tried in order until a borehole is found. The API is
    // meant for occasional lookups, so most places should be answered by the first step.
    const BOREHOLE_RADII_KM = [0.5, 1, 2, 5];

    // The G and GT XML use different namespaces, so elements are matched by local name.
    function elementsNamed(parent, name) {
      return Array.from(parent.getElementsByTagNameNS("*", name));
    }
    function textOf(parent, name) {
      const el = elementsNamed(parent, name)[0];
      return el ? el.textContent.trim() : null;
    }

    async function searchBoreholes(type, ll, radiusKm) {
      const body = {
        area: { enclosingCircle: { center: { lat: ll.y, lon: ll.x }, radius: radiusKm } },
      };
      const response = await fetch(BRO_APIS[type] + "/characteristics/searches", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!response.ok) {
        throw new Error("BRO search (" + type + ") failed: HTTP " + response.status);
      }
      const xml = new DOMParser().parseFromString(await response.text(), "application/xml");

      // The position is "lat lon", the reverse of the x/y order of ll.
      return elementsNamed(xml, "dispatchDocument").map((doc) => {
        const [lat, lon] = textOf(doc, "pos").split(" ").map(Number);
        return { type: type, broId: textOf(doc, "broId"), lat: lat, lon: lon };
      });
    }

    // Flat-earth approximation, accurate enough over a few kilometres.
    function distanceMetres(lat1, lon1, lat2, lon2) {
      const dy = (lat2 - lat1) * 111200;
      const dx = (lon2 - lon1) * 111200 * Math.cos((lat1 * Math.PI) / 180);
      return Math.hypot(dx, dy);
    }

    // Returns the closest borehole of either type, or null if the largest radius is empty.
    async function findBorehole(ll) {
      for (const radiusKm of BOREHOLE_RADII_KM) {
        const [g, gt] = await Promise.all([
          searchBoreholes("G", ll, radiusKm),
          searchBoreholes("GT", ll, radiusKm),
        ]);
        const all = g.concat(gt).map((b) => ({
          ...b,
          distance: Math.round(distanceMetres(ll.y, ll.x, b.lat, b.lon)),
        }));
        if (all.length > 0) {
          all.sort((a, b) => a.distance - b.distance);
          return all[0];
        }
      }
      return null;
    }

    // A layer is named by soilNameNEN5104 (G) or geotechnicalSoilName (GT), or carries
    // a specialMaterial instead. `anthropogenic` is "ja", "nee" or "onbekend".
    async function fetchLayers(borehole) {
      const response = await fetch(BRO_APIS[borehole.type] + "/objects/" + borehole.broId);
      if (!response.ok) {
        throw new Error("BRO fetch failed: HTTP " + response.status);
      }
      const xml = new DOMParser().parseFromString(await response.text(), "application/xml");

      return elementsNamed(xml, "layer").map((layer) => ({
        from: Number(textOf(layer, "upperBoundary")),
        to: Number(textOf(layer, "lowerBoundary")),
        anthropogenic: textOf(layer, "anthropogenic"),
        material:
          textOf(layer, "soilNameNEN5104") ||
          textOf(layer, "geotechnicalSoilName") ||
          textOf(layer, "specialMaterial"),
      }));
    }

    // The first layer that is not fill or paving.
    function firstNaturalLayer(layers) {
      return layers.find((l) => l.anthropogenic !== "ja" && l.material) || null;
    }

    const input = document.getElementById("place");
    const answer = document.getElementById("answer");
    const output = document.getElementById("output");

    let latestLookup = 0;

    async function showAnswer(lookup) {
      const thisLookup = ++latestLookup;
      const isCurrent = () => thisLookup === latestLookup;
      answer.replaceChildren();
      output.textContent = "Searching...";
      try {
        const result = await lookup(isCurrent);
        if (!isCurrent()) {
          return;
        }
        if (result.soilName) {
          const em = document.createElement("em");
          em.textContent = result.soilName;
          answer.append("Je bent een ", em, "-Drent!");
        }
        output.textContent = result.details;
      } catch (err) {
        if (!isCurrent()) {
          return;
        }
        output.textContent = "Er ging iets fout: " + err.message;
      }
    }

    function clearAnswer() {
      latestLookup++;
      answer.replaceChildren();
      output.textContent = "";
    }

    function onSearch() {
      showAnswer((isCurrent) => answerFor(input.value.trim(), isCurrent));
    }

    // A search: name -> place -> the shared point lookup.
    async function answerFor(placeName, isCurrent) {
      const place = await findPlace(placeName);
      if (!place) {
        return { soilName: "", details: "Geen plaats gevonden in Drenthe." };
      }
      if (isCurrent()) {
        showOnMap(place.ll.y, place.ll.x, PLACE_ZOOM);
      }
      return answerForPoint({ label: place.name, rd: place.rd, ll: place.ll });
    }

    // A map click: lat/lon -> is it in Drenthe? -> RD -> the shared point lookup.
    async function answerForClick(latlng) {
      const place = await findPlaceAt(latlng.lat, latlng.lng);
      if (!place) {
        return { soilName: "", details: "Dit punt ligt niet in Drenthe. Klik binnen de provincie of zoek een plaats." };
      }
      return answerForPoint({
        label: "Kaartklik in " + place.name,
        rd: toRd(latlng.lat, latlng.lng),
        ll: { x: latlng.lng, y: latlng.lat },   // same shape as place.ll: x = longitude, y = latitude
      });
    }

    async function answerForPoint(point) {
      let text =
        point.label + "\n" +
        "RD (metres):  x=" + point.rd.x + "  y=" + point.rd.y + "\n" +
        "WGS84 (deg):  lon=" + point.ll.x + "  lat=" + point.ll.y + "\n\n";

      const features = await findSoil(point.rd.x, point.rd.y);
      if (features.length > 0) {
        const props = features[0].properties;
        return {
          soilName: dashedName(props.normal_soilprofile_name),
          details: "Meer informatie: \n \n" +
            text +
            "Bodemcode " + props.normal_soilprofile_code + ".\n\n" +
            "Raw attributes:\n" + JSON.stringify(props, null, 2),
        };
      }

      // The soil map has no data for built-up areas: fall back to a borehole.
      const borehole = await findBorehole(point.ll);
      if (!borehole) {
        return {
          soilName: "",
          details: text + "Geen bodemkaartgegevens hier, en geen boorgegevens gevonden binnen een straal van " +
            BOREHOLE_RADII_KM[BOREHOLE_RADII_KM.length - 1] + " km.",
        };
      }

      const layers = await fetchLayers(borehole);
      const layer = firstNaturalLayer(layers);

      const table = layers
        .map((l) => {
          const mark = l === layer ? "  <-- gebruikt" : "";
          return "  " + l.from.toFixed(2) + " - " + l.to.toFixed(2) + " m  " +
            (l.anthropogenic === "ja" ? "[fill] " : "       ") + (l.material || "?") + mark;
        })
        .join("\n");

      return {
        soilName: layer ? dashedName(layer.material) : "",
        details: text +
          (layer ? "" : "Er werden boorgegevens gevonden, maar hiervan kon geen laag gebruikt worden.\n\n") +
          "(Dit zijn de gegevens van boorgat " + borehole.broId + " (BHR-" + borehole.type + "), " +
          borehole.distance + " m. verwijderd van zoeklocatie.)\n\n" +
          "Lagen:\n" + table,
      };
    }

    // --- Reprojection: WGS84 -> RD ---

    const RD_DEFINITION =
      "+proj=sterea +lat_0=52.15616055555555 +lon_0=5.38763888888889 +k=0.9999079 " +
      "+x_0=155000 +y_0=463000 +ellps=bessel " +
      "+towgs84=565.4171,50.3319,465.5524,-0.398957,0.343988,-1.87740,4.0725 +units=m +no_defs";

    // Leaflet gives a click as latitude and longitude; the soil map wants RD metres.
    // proj4 takes [longitude, latitude], the reverse of how Leaflet names them.
    function toRd(lat, lon) {
      const [x, y] = proj4("EPSG:4326", RD_DEFINITION, [lon, lat]);
      return { x: x, y: y };
    }

    // --- Map ---
    // The Leaflet script defines one global called `L`.
    const Leaflet = L;

    const DRENTHE_BOUNDS = Leaflet.latLngBounds([52.6, 6.1], [53.2, 7.1]);
    const MAX_BOUNDS = Leaflet.latLngBounds([52.45, 5.95], [53.35, 7.25]);

    // Leaflet works in Web Mercator (EPSG:3857) internally but we hand it lat/lon;
    // it does that conversion for us.
    const map = Leaflet.map("map",{ maxBounds: MAX_BOUNDS, minZoom: 8, maxZoom: 19, zoomSnap: 0.25 })
      .fitBounds(DRENTHE_BOUNDS);

    Leaflet.tileLayer(
      "https://service.pdok.nl/brt/achtergrondkaart/wmts/v2_0/standaard/EPSG:3857/{z}/{x}/{y}.png",
      { attribution: "Kaartgegevens &copy; <a href='https://www.kadaster.nl'>Kadaster</a>" }
    ).addTo(map);

    const PLACE_ZOOM = 12;
    let marker = null;

    function showOnMap(lat, lon, zoom) {
      if (marker) {
        marker.setLatLng([lat, lon]);
      } else {
        marker = Leaflet.marker([lat, lon]).addTo(map);
      }
      // Drop the button of an earlier click: it would search the wrong spot from here on.
      marker.unbindPopup();
      if (zoom) {
        map.setView([lat, lon], zoom);
      }
    }

    function offerLookup(latlng) {
      const button = document.createElement("button");
      button.textContent = "Zoek hier";
      button.addEventListener("click", () => {
        marker.closePopup();
        showAnswer(() => answerForClick(latlng));
      });
      marker.bindPopup(button).openPopup();
    }

    // Leaflet names the longitude `lng`; the rest of this file says `lon`.
    map.on("click", (event) => {
      showOnMap(event.latlng.lat, event.latlng.lng);
      clearAnswer();   // the old answer belongs to the previous spot
      offerLookup(event.latlng);
    });

    document.getElementById("search").addEventListener("click", onSearch);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") onSearch(); });
  </script>
</body>
</html>
